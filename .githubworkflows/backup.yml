name: Weekly Backup

on:
  schedule:
    - cron: '0 2 * * 0'  # Chaque dimanche à 2h du matin

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Create backup
        run: |
          mkdir -p backups
          tar -czf backups/igisem-$(date +%Y%m%d).tar.gz --exclude='wp-content/uploads' --exclude='wp-content/plugins' .
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add backups/
          git commit -m "Backup $(date +%Y-%m-%d)" || true
          git push